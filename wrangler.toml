name = "bons-intervention-semise"
main = "src/worker.js"
compatibility_date = "2026-07-23"

# Coupe la route *.workers.dev. Cloudflare Access protège le domaine
# personnalisé, PAS workers.dev : laisser cette route ouverte permettrait
# de contourner l'authentification en devinant l'URL.
workers_dev = false

# Seul ce dossier est publié. Il ne contient que du code, aucune donnée.
[assets]
directory = "./public"

[vars]
# Renseigner avec le domaine d'équipe Zero Trust et l'Audience Tag de
# l'application Access (Zero Trust > Access > Applications > Overview).
ACCESS_TEAM_DOMAIN = "A_RENSEIGNER.cloudflareaccess.com"
ACCESS_AUD = "A_RENSEIGNER"

[[kv_namespaces]]
binding = "BONS"
# Remplacer par l'id rendu par : wrangler kv namespace create BONS
id = "A_RENSEIGNER"
